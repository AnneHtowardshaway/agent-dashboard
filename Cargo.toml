[package]
name = "ag-pulse"
version = "0.1.0"
edition = "2021"
description = "Ultra-low-memory multi-host metrics collector and CDP bridge for Antigrative Dashboard"
license = "MIT"

[[bin]]
name = "ag-pulse"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
